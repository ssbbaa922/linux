name: Build PS4 Kernel 6.6.y

on:
  push:
    branches:
      - ps4-linux-6.6.y
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        ref: ps4-linux-6.6.y

    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc dwarves

    - name: Configure and Compile Kernel
      run: |
        if [ -f config ]; then
          cp config .config
        elif [ -f arch/x86/configs/ps4_defconfig ]; then
          cp arch/x86/configs/ps4_defconfig .config
        else
          make defconfig
        fi
        make olddefconfig
        make -j$(nproc) bzImage

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bzImage-6.6.y-PS4
        path: arch/x86/boot/bzImage
